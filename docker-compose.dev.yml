services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - app

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:worker
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - app

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/projectfinder
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./python-worker:/app
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - app

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - app

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - app

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  api_node_modules:

networks:
  app:
    driver: bridge
